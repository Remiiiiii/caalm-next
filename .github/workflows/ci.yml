name: CI

on:
  push:
    branches: [main, develop, chore/*, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint
        continue-on-error: true

  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test
        env:
          CI: true
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT || 'https://cloud.appwrite.io/v1' }}
          NEXT_PUBLIC_APPWRITE_PROJECT: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT || 'test-project-id' }}
          NEXT_PUBLIC_APPWRITE_DATABASE: ${{ secrets.NEXT_PUBLIC_APPWRITE_DATABASE || 'test-database-id' }}
          NEXT_APPWRITE_API_KEY: ${{ secrets.NEXT_APPWRITE_API_KEY || 'test-api-key-for-ci' }}
          NEXT_PUBLIC_APPWRITE_USERS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_USERS_COLLECTION || 'test-users' }}
          NEXT_PUBLIC_APPWRITE_FILES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_FILES_COLLECTION || 'test-files' }}
          NEXT_PUBLIC_APPWRITE_CONTRACTS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CONTRACTS_COLLECTION || 'test-contracts' }}
          NEXT_PUBLIC_APPWRITE_CONTRACTS_ENTERPRISE_METADATA_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CONTRACTS_ENTERPRISE_METADATA_COLLECTION || 'test-contracts-enterprise-metadata' }}
          NEXT_PUBLIC_APPWRITE_CONTRACT_EXTENSIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CONTRACT_EXTENSIONS_COLLECTION || 'test-contract-extensions' }}
          NEXT_PUBLIC_APPWRITE_CONTRACT_DRAFTS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CONTRACT_DRAFTS_COLLECTION || 'test-contract-drafts' }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_EVENTS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_EVENTS_COLLECTION || 'test-calendar-events' }}
          NEXT_PUBLIC_APPWRITE_RECENT_ACTIVITIES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_RECENT_ACTIVITIES_COLLECTION || 'test-recent-activities' }}
          NEXT_PUBLIC_APPWRITE_INVITATIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_INVITATIONS_COLLECTION || 'test-invitations' }}
          NEXT_PUBLIC_APPWRITE_REPORTS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_REPORTS_COLLECTION || 'test-reports' }}
          NEXT_PUBLIC_APPWRITE_LICENSES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_LICENSES_COLLECTION || 'test-licenses' }}
          NEXT_PUBLIC_APPWRITE_OTPTOKENS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_OTPTOKENS_COLLECTION || 'test-otp-tokens' }}
          NEXT_PUBLIC_APPWRITE_NOTIFICATIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTIFICATIONS_COLLECTION || 'test-notifications' }}
          NEXT_PUBLIC_APPWRITE_NOTIFICATION_TYPES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTIFICATION_TYPES_COLLECTION || 'test-notification-types' }}
          NEXT_PUBLIC_APPWRITE_NOTIFICATION_SETTINGS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTIFICATION_SETTINGS_COLLECTION || 'test-notification-settings' }}
          NEXT_PUBLIC_APPWRITE_SMS_FORM_SUBMISSIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_SMS_FORM_SUBMISSIONS_COLLECTION || 'test-sms-form-submissions' }}
          NEXT_PUBLIC_APPWRITE_NOTIFICATION_DIGEST_QUEUE_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTIFICATION_DIGEST_QUEUE_COLLECTION || 'test-notification-digest-queue' }}
          NEXT_PUBLIC_APPWRITE_NOTES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTES_COLLECTION || 'test-notes' }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_APPROVALS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_APPROVALS_COLLECTION || 'test-calendar-approvals' }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_PERMISSION_OVERRIDES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_PERMISSION_OVERRIDES_COLLECTION || 'test-calendar-permission-overrides' }}
          NEXT_PUBLIC_APPWRITE_BUCKET: ${{ secrets.NEXT_PUBLIC_APPWRITE_BUCKET || 'test-bucket' }}
          NEXT_PUBLIC_APPWRITE_PROFILE_PICTURES_BUCKET: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROFILE_PICTURES_BUCKET || 'test-profile-pictures-bucket' }}
          NEXT_PUBLIC_APPWRITE_AUDIT_LOGS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_AUDIT_LOGS_COLLECTION || 'test-audit-logs' }}
          NEXT_PUBLIC_APPWRITE_AUDITS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_AUDITS_COLLECTION || 'test-audits' }}
          GOV_API_KEY: ${{ secrets.GOV_API_KEY || '' }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID || '' }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN || '' }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER || '' }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID || '' }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET || '' }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID || '' }}
          NEXT_PUBLIC_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_REDIRECT_URI || '' }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_INTEGRATIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_INTEGRATIONS_COLLECTION || 'test-calendar-integrations' }}
          NEXT_PUBLIC_APPWRITE_SHARED_CALENDARS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_SHARED_CALENDARS_COLLECTION || 'test-shared-calendars' }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_RESOURCES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_RESOURCES_COLLECTION || 'test-calendar-resources' }}
          NEXT_PUBLIC_APPWRITE_RESOURCE_BOOKINGS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_RESOURCE_BOOKINGS_COLLECTION || 'test-resource-bookings' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT || 'https://cloud.appwrite.io/v1' }}
          NEXT_PUBLIC_APPWRITE_PROJECT: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT || 'test-project-id' }}
          NEXT_PUBLIC_APPWRITE_DATABASE: ${{ secrets.NEXT_PUBLIC_APPWRITE_DATABASE || 'test-database-id' }}
          NEXT_APPWRITE_API_KEY: ${{ secrets.NEXT_APPWRITE_API_KEY || 'test-api-key-for-ci' }}
          NEXT_PUBLIC_APPWRITE_USERS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_USERS_COLLECTION || 'test-users' }}
          NEXT_PUBLIC_APPWRITE_FILES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_FILES_COLLECTION || 'test-files' }}
          NEXT_PUBLIC_APPWRITE_CONTRACTS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CONTRACTS_COLLECTION || 'test-contracts' }}
          NEXT_PUBLIC_APPWRITE_CONTRACTS_ENTERPRISE_METADATA_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CONTRACTS_ENTERPRISE_METADATA_COLLECTION || 'test-contracts-enterprise-metadata' }}
          NEXT_PUBLIC_APPWRITE_CONTRACT_EXTENSIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CONTRACT_EXTENSIONS_COLLECTION || 'test-contract-extensions' }}
          NEXT_PUBLIC_APPWRITE_CONTRACT_DRAFTS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CONTRACT_DRAFTS_COLLECTION || 'test-contract-drafts' }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_EVENTS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_EVENTS_COLLECTION || 'test-calendar-events' }}
          NEXT_PUBLIC_APPWRITE_RECENT_ACTIVITIES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_RECENT_ACTIVITIES_COLLECTION || 'test-recent-activities' }}
          NEXT_PUBLIC_APPWRITE_INVITATIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_INVITATIONS_COLLECTION || 'test-invitations' }}
          NEXT_PUBLIC_APPWRITE_REPORTS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_REPORTS_COLLECTION || 'test-reports' }}
          NEXT_PUBLIC_APPWRITE_LICENSES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_LICENSES_COLLECTION || 'test-licenses' }}
          NEXT_PUBLIC_APPWRITE_OTPTOKENS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_OTPTOKENS_COLLECTION || 'test-otp-tokens' }}
          NEXT_PUBLIC_APPWRITE_NOTIFICATIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTIFICATIONS_COLLECTION || 'test-notifications' }}
          NEXT_PUBLIC_APPWRITE_NOTIFICATION_TYPES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTIFICATION_TYPES_COLLECTION || 'test-notification-types' }}
          NEXT_PUBLIC_APPWRITE_NOTIFICATION_SETTINGS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTIFICATION_SETTINGS_COLLECTION || 'test-notification-settings' }}
          NEXT_PUBLIC_APPWRITE_SMS_FORM_SUBMISSIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_SMS_FORM_SUBMISSIONS_COLLECTION || 'test-sms-form-submissions' }}
          NEXT_PUBLIC_APPWRITE_NOTIFICATION_DIGEST_QUEUE_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTIFICATION_DIGEST_QUEUE_COLLECTION || 'test-notification-digest-queue' }}
          NEXT_PUBLIC_APPWRITE_NOTES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTES_COLLECTION || 'test-notes' }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_APPROVALS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_APPROVALS_COLLECTION || 'test-calendar-approvals' }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_PERMISSION_OVERRIDES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_PERMISSION_OVERRIDES_COLLECTION || 'test-calendar-permission-overrides' }}
          NEXT_PUBLIC_APPWRITE_BUCKET: ${{ secrets.NEXT_PUBLIC_APPWRITE_BUCKET || 'test-bucket' }}
          NEXT_PUBLIC_APPWRITE_PROFILE_PICTURES_BUCKET: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROFILE_PICTURES_BUCKET || 'test-profile-pictures-bucket' }}
          NEXT_PUBLIC_APPWRITE_AUDIT_LOGS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_AUDIT_LOGS_COLLECTION || 'test-audit-logs' }}
          NEXT_PUBLIC_APPWRITE_AUDITS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_AUDITS_COLLECTION || 'test-audits' }}
          GOV_API_KEY: ${{ secrets.GOV_API_KEY || '' }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID || '' }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN || '' }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER || '' }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID || '' }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET || '' }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID || '' }}
          NEXT_PUBLIC_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_REDIRECT_URI || '' }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_INTEGRATIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_INTEGRATIONS_COLLECTION || 'test-calendar-integrations' }}
          NEXT_PUBLIC_APPWRITE_SHARED_CALENDARS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_SHARED_CALENDARS_COLLECTION || 'test-shared-calendars' }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_RESOURCES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_RESOURCES_COLLECTION || 'test-calendar-resources' }}
          NEXT_PUBLIC_APPWRITE_RESOURCE_BOOKINGS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_RESOURCE_BOOKINGS_COLLECTION || 'test-resource-bookings' }}
