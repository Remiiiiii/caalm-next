# Playwright E2E on pushes & PRs; production Vercel deploy only after tests pass on main.
#
# Required GitHub repository secrets (for deploy):
#   VERCEL_TOKEN       — https://vercel.com/account/tokens
#   VERCEL_PROJECT_ID  — Project Settings → General → Project ID
#   VERCEL_USER_ID     — Team ID (Team Settings → General), used as vercel-org-id
#
# Playwright also uses the Appwrite / Twilio / Microsoft secrets listed on the test step
# (same as former CI workflow). Add them under Repository secrets if tests need real backends.
#
# Avoid double production deploys: see vercel.json ignoreCommand + Vercel Git settings.

name: Tests and Vercel deploy

on:
  push:
    branches: [main, develop, chore/*, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test
        env:
          CI: true
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT }}
          NEXT_PUBLIC_APPWRITE_DATABASE: ${{ secrets.NEXT_PUBLIC_APPWRITE_DATABASE }}
          NEXT_APPWRITE_API_KEY: ${{ secrets.NEXT_APPWRITE_API_KEY }}
          NEXT_PUBLIC_APPWRITE_USERS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_USERS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_FILES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_FILES_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_CONTRACTS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CONTRACTS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_CONTRACTS_ENTERPRISE_METADATA_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CONTRACTS_ENTERPRISE_METADATA_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_CONTRACT_EXTENSIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CONTRACT_EXTENSIONS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_CONTRACT_DRAFTS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CONTRACT_DRAFTS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_EVENTS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_EVENTS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_RECENT_ACTIVITIES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_RECENT_ACTIVITIES_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_INVITATIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_INVITATIONS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_REPORTS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_REPORTS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_LICENSES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_LICENSES_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_OTPTOKENS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_OTPTOKENS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_NOTIFICATIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTIFICATIONS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_NOTIFICATION_TYPES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTIFICATION_TYPES_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_NOTIFICATION_SETTINGS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTIFICATION_SETTINGS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_SMS_FORM_SUBMISSIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_SMS_FORM_SUBMISSIONS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_NOTIFICATION_DIGEST_QUEUE_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTIFICATION_DIGEST_QUEUE_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_NOTES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_NOTES_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_APPROVALS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_APPROVALS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_PERMISSION_OVERRIDES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_PERMISSION_OVERRIDES_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_BUCKET: ${{ secrets.NEXT_PUBLIC_APPWRITE_BUCKET }}
          NEXT_PUBLIC_APPWRITE_PROFILE_PICTURES_BUCKET: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROFILE_PICTURES_BUCKET }}
          NEXT_PUBLIC_APPWRITE_AUDIT_LOGS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_AUDIT_LOGS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_AUDITS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_AUDITS_COLLECTION }}
          GOV_API_KEY: ${{ secrets.GOV_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          NEXT_PUBLIC_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_REDIRECT_URI }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_INTEGRATIONS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_INTEGRATIONS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_SHARED_CALENDARS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_SHARED_CALENDARS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_CALENDAR_RESOURCES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_CALENDAR_RESOURCES_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_RESOURCE_BOOKINGS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_RESOURCE_BOOKINGS_COLLECTION }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to Vercel (production)
    needs: playwright
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_USER_ID: ${{ secrets.VERCEL_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_USER_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./
