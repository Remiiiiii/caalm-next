        - generic [ref=f5e1450]:
          - heading "15--RADOME, IN REPAIR/MODIFICATION OF" [level=2] [ref=f5e1451]
          - paragraph [ref=f5e1452]: "ID: fe294262bc1643719c137164373b199f"
        - generic [ref=f5e1453]:
          - generic [ref=f5e1454] [cursor=pointer]: Smart Summary
          - paragraph [ref=f5e1462]: "The Department of the Navy (NAVSUP WSS Philadelphia) has issued a presolicitation for the repair/modification of a Radome (NSN 7R-1560-015415158-QE, Quantity: 18 EA). The procurement is restricted as a sole-source intent under FAR 6.302-1 due to flight-critical engineering source approval requirements and proprietary technical data. Interested vendors must provide comprehensive source approval documentation alongside their proposals by January 4, 2027, or risk immediate disqualification."
        - generic [ref=f5e1463]:
          - generic [ref=f5e1464] [cursor=pointer]: Full Description
          - generic [ref=f5e1571]:
            - paragraph [ref=f5e1572]: "NSN 7R-1560-015415158-QE, IAW REF NR 74A301001-1003, QTY 18 EA, DELIVERY FOB ORIGIN. This part requires engineering source approval by the design control activity in order to maintain the quality of the part. Existing unique design capability, engineering skills, and manufacturing/repair knowledge by the qualified source(s) require acquisition/repair of the part from the approved source(s). The approved source(s) retain data rights,manufacturing/repair knowledge, or technical data that are not economically available to the Government, and the data or knowledge is essential to maintaining the quality of the part. An alternate source must qualify in accordance with the design control activity's procedures, as approved by the cognizant Government engineering activity. The qualification procedures must be approved by the Government engineering activity having jurisdiction over the part in the intended application. The subject item requires Government source approval prior to contract award, as the item is flight critical and/or the technical data available has not been determined adequate to support acquisition via full and open competition. Only the source(s) previously approved by the Government for this item have been solicited. The time required for approval of a new source is normally such that an award cannot be delayed pending approval of a new source. If you are not an approved source you must submit, together with your proposal, the information detailed in one of the NAVSUP Weapon Systems Support (NAVSUP WSS) Source Approval Information Brochures listed below. Spares: https://www.navsup.navy.mil/NAVSUP-Enterprise/NAVSUP-Weapon-Systems-Sup port/Business-Opps/ Repair: https://www.navsup.navy.mil/NAVSUP-Enterprise/NAVSUP -Weapon-Systems-Support/Business-Opps/ technical data required to be submitted based on your company's experience in production of the same or similar item, or if this is an item you have never made. If your request for source approval is currently being evaluated at NAVSUP WSS submit with your offer a copy of the cover letter which forwarded your request for source approval. Offers received which fail to provide all data required by the Source Approval Brochure or document previous submission of all data required by the Source Approval Brochure will not be considered for award under this solicitation. Please note, if evaluation of a source approval request submitted hereunder cannot be processed in time and/or approval requirements preclude the ability to obtain subject items in time to meet Government requirements, award of the subject requirement may continue based on Fleet support needs. The NAVSUP WSS Commercial Item Identification Brochure is now available at: \"https://www.navsup.navy.mil/NAVSUP-Enterprise/NAVSUP-Weapon-Systems-Support/Bus iness-Opps/\""
